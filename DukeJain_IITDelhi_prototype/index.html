<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototype</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Demo moments">
      <div class="rail-brand">
        <span id="brand-plate"></span>
        <div>
          <strong id="brand-name"></strong>
          <span id="brand-tag"></span>
        </div>
      </div>
      <nav id="rail-list" class="rail-list"></nav>
      <div class="rail-foot">
        <label class="rail-opt"><input type="checkbox" id="show-grad" checked> Include Graduation (optional)</label>
        <button class="btn ghost small" id="reset">Reset demo</button>
        <button class="btn ghost small" id="hide-rail" title="Shortcut: H">Hide this panel</button>
        <p>Prototype: every agent reply is scripted. No real AI, no internet.</p>
      </div>
    </aside>

    <main class="stage">
      <p class="stage-caption" id="caption"></p>
      <div class="phone">
        <div class="phone-notch"></div>
        <div class="screen" id="screen"></div>
      </div>
      <div class="stage-nav">
        <button class="btn ghost small" id="prev">&larr; Previous</button>
        <button class="btn primary small" id="next">Next moment &rarr;</button>
        <label class="bts-toggle" title="Shortcut: B"><input type="checkbox" id="bts"> Behind the scenes</label>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
